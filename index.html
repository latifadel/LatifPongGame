<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Giant Offline Games - Single HTML</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* 
      INLINE CSS 
      Because we are putting everything in one file (HTML + CSS + JS),
      this style block takes care of all styling.
      No placeholders, all functional or aesthetic rules for the 6 games.
    */

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 2rem;
      color: #ffd700;
    }

    #game-menu {
      margin-bottom: 20px;
    }
    #game-menu button {
      margin: 0 5px;
      padding: 8px 16px;
      background: #444;
      border: 1px solid #666;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
    }
    #game-menu button:hover {
      background: #666;
    }

    .game-section {
      display: none; /* hidden by default; we show one at a time */
      margin-bottom: 30px;
    }

    /* ======== PONG vs AI ======== */
    #pong-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #111;
      border: 2px solid #666;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0,0,0,0.5);
    }
    #pong-canvas {
      display: block;
      background: transparent;
    }
    #pong-scoreboard {
      position: absolute;
      top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 1.2em;
      z-index: 2;
    }
    #pong-scoreboard .score {
      background: rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
    }

    /* ======== SNAKE ======== */
    #snake-container {
      position: relative;
      width: 400px;
      height: 400px;
      background: #111;
      border: 2px solid #666;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0,0,0,0.5);
    }
    #snake-canvas {
      display: block;
    }
    #snake-scoreboard {
      position: absolute;
      top: 10px;
      left: 10px;
      font-weight: bold;
    }

    /* ======== TETRIS ======== */
    #tetris-container {
      position: relative;
      width: 240px;
      height: 400px;
      background: #111;
      border: 2px solid #666;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0,0,0,0.5);
    }
    #tetris-canvas {
      display: block;
    }
    #tetris-info {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #fff;
      font-size: 0.9rem;
    }

    /* ======== BRICK BREAKER ======== */
    #brick-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #111;
      border: 2px solid #666;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0,0,0,0.5);
    }
    #brick-canvas {
      display: block;
    }
    #brick-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      font-weight: bold;
    }

    /* ======== TIC TAC TOE ======== */
    #tic-container {
      background: #111;
      border: 2px solid #666;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 16px rgba(0,0,0,0.5);
      width: 280px;
      text-align: center;
    }
    .tic-row {
      display: flex;
    }
    .tic-cell {
      width: 80px;
      height: 80px;
      border: 1px solid #777;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      color: #fff;
      background: #222;
    }
    #tic-message {
      margin-top: 10px;
      font-weight: bold;
    }

    /* ======== MINESWEEPER ======== */
    #minesweeper-container {
      display: inline-block;
      background: #111;
      border: 2px solid #666;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0,0,0,0.5);
      padding: 10px;
    }
    #minesweeper-board {
      display: grid;
      grid-template-columns: repeat(10, 30px);
      grid-template-rows: repeat(10, 30px);
      gap: 2px;
    }
    .mine-cell {
      width: 30px;
      height: 30px;
      background: #222;
      color: #fff;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      border: 1px solid #555;
    }
    .revealed {
      background: #444;
      cursor: default;
    }
    .mine {
      background: red;
    }
    #minesweeper-hud {
      margin-bottom: 8px;
      text-align: center;
    }

    /* Show the visible game-section */
    .visible-game {
      display: block;
    }
  </style>
</head>
<body>

<h1>Giant Offline Games (Single HTML)</h1>

<div id="game-menu">
  <button onclick="showGame('pong')">Pong vs AI</button>
  <button onclick="showGame('snake')">Snake</button>
  <button onclick="showGame('tetris')">Tetris</button>
  <button onclick="showGame('brick')">Brick Breaker</button>
  <button onclick="showGame('tic')">Tic Tac Toe</button>
  <button onclick="showGame('mines')">Minesweeper</button>
</div>

<!-- ======== PONG SECTION ======== -->
<div id="pong-section" class="game-section">
  <div id="pong-container">
    <canvas id="pong-canvas" width="800" height="600"></canvas>
    <div id="pong-scoreboard">
      <div class="score">
        <span>Player:</span>
        <span id="pong-player-score">0</span>
      </div>
      <div class="score">
        <span>AI:</span>
        <span id="pong-ai-score">0</span>
      </div>
    </div>
  </div>
</div>

<!-- ======== SNAKE SECTION ======== -->
<div id="snake-section" class="game-section">
  <div id="snake-container">
    <canvas id="snake-canvas" width="400" height="400"></canvas>
    <div id="snake-scoreboard">
      Score: <span id="snake-score">0</span>
    </div>
  </div>
</div>

<!-- ======== TETRIS SECTION ======== -->
<div id="tetris-section" class="game-section">
  <div id="tetris-container">
    <canvas id="tetris-canvas" width="240" height="400"></canvas>
    <div id="tetris-info">
      <p>Score: <span id="tetris-score">0</span></p>
      <p>Lines: <span id="tetris-lines">0</span></p>
    </div>
  </div>
</div>

<!-- ======== BRICK BREAKER SECTION ======== -->
<div id="brick-section" class="game-section">
  <div id="brick-container">
    <canvas id="brick-canvas" width="800" height="600"></canvas>
    <div id="brick-hud">
      Score: <span id="brick-score">0</span><br/>
      Lives: <span id="brick-lives">3</span>
    </div>
  </div>
</div>

<!-- ======== TIC TAC TOE SECTION ======== -->
<div id="tic-section" class="game-section">
  <div id="tic-container">
    <div class="tic-row">
      <div class="tic-cell" data-index="0"></div>
      <div class="tic-cell" data-index="1"></div>
      <div class="tic-cell" data-index="2"></div>
    </div>
    <div class="tic-row">
      <div class="tic-cell" data-index="3"></div>
      <div class="tic-cell" data-index="4"></div>
      <div class="tic-cell" data-index="5"></div>
    </div>
    <div class="tic-row">
      <div class="tic-cell" data-index="6"></div>
      <div class="tic-cell" data-index="7"></div>
      <div class="tic-cell" data-index="8"></div>
    </div>
    <div id="tic-message"></div>
  </div>
</div>

<!-- ======== MINESWEEPER SECTION ======== -->
<div id="mines-section" class="game-section">
  <div id="minesweeper-container">
    <div id="minesweeper-hud">
      Mines: <span id="mines-left">10</span>
    </div>
    <div id="minesweeper-board">
      <!-- Cells are generated by JS -->
    </div>
  </div>
</div>

<script>
/******************************************************
  GIANT SINGLE-FILE JAVASCRIPT FOR MULTIPLE GAMES
******************************************************/

/* 
  Table of contents:
  1) GLOBAL: showGame() logic
  2) PONG vs AI
  3) SNAKE
  4) TETRIS
  5) BRICK BREAKER
  6) TIC TAC TOE
  7) MINESWEEPER
*/

/******************************************************
 ***************** 1) SHOW / HIDE GAMES ***************
*******************************************************/
const gameSections = {
  pong: document.getElementById('pong-section'),
  snake: document.getElementById('snake-section'),
  tetris: document.getElementById('tetris-section'),
  brick: document.getElementById('brick-section'),
  tic: document.getElementById('tic-section'),
  mines: document.getElementById('mines-section')
};

function showGame(key) {
  // Hide all
  for (let k in gameSections) {
    gameSections[k].classList.remove('visible-game');
  }
  // Show the chosen
  gameSections[key].classList.add('visible-game');

  // (Re)start the chosen game
  if (key === 'pong') startPong();
  if (key === 'snake') startSnake();
  if (key === 'tetris') startTetris();
  if (key === 'brick') startBrick();
  if (key === 'tic') startTic();
  if (key === 'mines') startMines();
}

/******************************************************
 ****************** 2) PONG vs AI *********************
*******************************************************/
let pongCanvas, pongCtx, pongIntervalId;
let pPaddle, aiPaddle, pongBall;
let pongPlayerScore = 0;
let pongAiScore = 0;
let pongUpPressed = false;
let pongDownPressed = false;

function startPong() {
  // Clear old interval
  if (pongIntervalId) clearInterval(pongIntervalId);

  pongCanvas = document.getElementById('pong-canvas');
  pongCtx = pongCanvas.getContext('2d');

  // Reset scores
  pongPlayerScore = 0;
  pongAiScore = 0;
  document.getElementById('pong-player-score').textContent = pongPlayerScore;
  document.getElementById('pong-ai-score').textContent = pongAiScore;

  // Paddles
  pPaddle = { x: 20, y: 260, width: 10, height: 80, speed: 8 };
  aiPaddle = { x: 770, y: 260, width: 10, height: 80, speed: 5 };

  // Ball
  pongBall = { x: 400, y: 300, radius: 10, vx: 5, vy: 3 };

  // Listen for keys
  document.removeEventListener('keydown', pongKeyDown);
  document.removeEventListener('keyup', pongKeyUp);
  document.addEventListener('keydown', pongKeyDown);
  document.addEventListener('keyup', pongKeyUp);

  pongIntervalId = setInterval(pongGameLoop, 1000/60);
}

function pongKeyDown(e) {
  if (e.key === 'ArrowUp' || e.key === 'w') pongUpPressed = true;
  if (e.key === 'ArrowDown' || e.key === 's') pongDownPressed = true;
}

function pongKeyUp(e) {
  if (e.key === 'ArrowUp' || e.key === 'w') pongUpPressed = false;
  if (e.key === 'ArrowDown' || e.key === 's') pongDownPressed = false;
}

function pongGameLoop() {
  updatePong();
  drawPong();
}

function updatePong() {
  // Player paddle
  if (pongUpPressed) pPaddle.y -= pPaddle.speed;
  if (pongDownPressed) pPaddle.y += pPaddle.speed;
  if (pPaddle.y < 0) pPaddle.y = 0;
  if (pPaddle.y + pPaddle.height > pongCanvas.height) {
    pPaddle.y = pongCanvas.height - pPaddle.height;
  }

  // AI paddle
  let aiCenter = aiPaddle.y + aiPaddle.height/2;
  if (aiCenter < pongBall.y - 10) {
    aiPaddle.y += aiPaddle.speed;
  } else if (aiCenter > pongBall.y + 10) {
    aiPaddle.y -= aiPaddle.speed;
  }
  if (aiPaddle.y < 0) aiPaddle.y = 0;
  if (aiPaddle.y + aiPaddle.height > pongCanvas.height) {
    aiPaddle.y = pongCanvas.height - aiPaddle.height;
  }

  // Move ball
  pongBall.x += pongBall.vx;
  pongBall.y += pongBall.vy;

  // Collide top/bottom
  if (pongBall.y - pongBall.radius < 0 || pongBall.y + pongBall.radius > pongCanvas.height) {
    pongBall.vy *= -1;
  }

  // Collide with player
  if (
    pongBall.x - pongBall.radius < pPaddle.x + pPaddle.width &&
    pongBall.x - pongBall.radius > pPaddle.x && 
    pongBall.y > pPaddle.y && 
    pongBall.y < pPaddle.y + pPaddle.height
  ) {
    pongBall.vx *= -1.05;
    pongBall.vy *= 1.05;
    pongBall.x = pPaddle.x + pPaddle.width + pongBall.radius;
  }

  // Collide with AI
  if (
    pongBall.x + pongBall.radius > aiPaddle.x &&
    pongBall.x + pongBall.radius < aiPaddle.x + aiPaddle.width &&
    pongBall.y > aiPaddle.y &&
    pongBall.y < aiPaddle.y + aiPaddle.height
  ) {
    pongBall.vx *= -1.05;
    pongBall.vy *= 1.05;
    pongBall.x = aiPaddle.x - pongBall.radius;
  }

  // Scoring
  if (pongBall.x + pongBall.radius < 0) {
    pongAiScore++;
    updatePongScore();
    resetPongBall(-1);
  }
  if (pongBall.x - pongBall.radius > pongCanvas.width) {
    pongPlayerScore++;
    updatePongScore();
    resetPongBall(1);
  }
}

function drawPong() {
  pongCtx.clearRect(0, 0, pongCanvas.width, pongCanvas.height);

  // center line
  pongCtx.strokeStyle = '#666';
  pongCtx.setLineDash([5, 15]);
  pongCtx.beginPath();
  pongCtx.moveTo(pongCanvas.width/2, 0);
  pongCtx.lineTo(pongCanvas.width/2, pongCanvas.height);
  pongCtx.stroke();
  pongCtx.setLineDash([]);

  // paddles
  pongCtx.fillStyle = '#80ffe5';
  pongCtx.fillRect(pPaddle.x, pPaddle.y, pPaddle.width, pPaddle.height);
  pongCtx.fillStyle = '#ffbf80';
  pongCtx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.width, aiPaddle.height);

  // ball
  pongCtx.beginPath();
  pongCtx.arc(pongBall.x, pongBall.y, pongBall.radius, 0, Math.PI*2);
  pongCtx.fillStyle = '#fff';
  pongCtx.fill();
}

function updatePongScore() {
  document.getElementById('pong-player-score').textContent = pongPlayerScore;
  document.getElementById('pong-ai-score').textContent = pongAiScore;
  if (pongPlayerScore >= 5) {
    alert("You win at Pong!");
    startPong();
  } else if (pongAiScore >= 5) {
    alert("AI wins at Pong!");
    startPong();
  }
}

function resetPongBall(dir) {
  pongBall.x = 400;
  pongBall.y = 300;
  pongBall.vx = 5 * dir;
  pongBall.vy = 3 * (Math.random() > 0.5 ? 1 : -1);
}

/******************************************************
 ******************* 3) SNAKE *************************
*******************************************************/
let snakeCanvas, snakeCtx, snakeIntervalId;
let snakeCells = [];
let snakeDir = 'RIGHT';
let snakeFood = { x: 0, y: 0 };
let snakeScore = 0;
const snakeRows = 20;
const snakeCols = 20;
const snakeCellSize = 20;

function startSnake() {
  if (snakeIntervalId) clearInterval(snakeIntervalId);
  snakeCanvas = document.getElementById('snake-canvas');
  snakeCtx = snakeCanvas.getContext('2d');

  snakeScore = 0;
  document.getElementById('snake-score').textContent = snakeScore;

  snakeCells = [{ x: 10, y: 10 }];
  snakeDir = 'RIGHT';
  snakeFood = randomSnakeFood();

  document.removeEventListener('keydown', snakeKeyDown);
  document.addEventListener('keydown', snakeKeyDown);

  snakeIntervalId = setInterval(snakeGameLoop, 120);
}

function snakeKeyDown(e) {
  if (e.key === 'ArrowUp' && snakeDir !== 'DOWN') snakeDir = 'UP';
  if (e.key === 'ArrowDown' && snakeDir !== 'UP') snakeDir = 'DOWN';
  if (e.key === 'ArrowLeft' && snakeDir !== 'RIGHT') snakeDir = 'LEFT';
  if (e.key === 'ArrowRight' && snakeDir !== 'LEFT') snakeDir = 'RIGHT';
}

function snakeGameLoop() {
  updateSnake();
  drawSnake();
}

function updateSnake() {
  let head = { x: snakeCells[0].x, y: snakeCells[0].y };

  if (snakeDir === 'UP') head.y -= 1;
  if (snakeDir === 'DOWN') head.y += 1;
  if (snakeDir === 'LEFT') head.x -= 1;
  if (snakeDir === 'RIGHT') head.x += 1;

  // Wrap edges
  if (head.x < 0) head.x = snakeCols - 1;
  if (head.x >= snakeCols) head.x = 0;
  if (head.y < 0) head.y = snakeRows - 1;
  if (head.y >= snakeRows) head.y = 0;

  // Check collision with body
  for (let i = 0; i < snakeCells.length; i++) {
    if (snakeCells[i].x === head.x && snakeCells[i].y === head.y) {
      alert("Game Over (Snake). Score: " + snakeScore);
      startSnake();
      return;
    }
  }

  snakeCells.unshift(head);
  // Check eat
  if (head.x === snakeFood.x && head.y === snakeFood.y) {
    snakeScore++;
    document.getElementById('snake-score').textContent = snakeScore;
    snakeFood = randomSnakeFood();
  } else {
    snakeCells.pop();
  }
}

function drawSnake() {
  snakeCtx.fillStyle = '#111';
  snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);

  // Snake
  for (let i = 0; i < snakeCells.length; i++) {
    snakeCtx.fillStyle = i === 0 ? '#80ffe5' : '#49b7a1';
    snakeCtx.fillRect(
      snakeCells[i].x * snakeCellSize,
      snakeCells[i].y * snakeCellSize,
      snakeCellSize,
      snakeCellSize
    );
  }

  // Food
  snakeCtx.fillStyle = '#ffbf80';
  snakeCtx.fillRect(
    snakeFood.x * snakeCellSize,
    snakeFood.y * snakeCellSize,
    snakeCellSize,
    snakeCellSize
  );
}

function randomSnakeFood() {
  return {
    x: Math.floor(Math.random() * snakeCols),
    y: Math.floor(Math.random() * snakeRows)
  };
}

/******************************************************
 ******************* 4) TETRIS ************************
*******************************************************/

let tetrisCanvas, tetrisCtx;
let tetrisBoard, tetrisCurrentPiece;
let tetrisScore = 0;
let tetrisLines = 0;
let tetrisGameOver = false;
let tetrisIntervalId;
const tetrisRows = 20;
const tetrisCols = 10;
const tetrisCellSize = 20;

// Tetris shapes
const TETRIS_SHAPES = [
  // shape O
  [[1,1],[1,1]],
  // shape I
  [[1],[1],[1],[1]],
  // shape S
  [[0,1,1],[1,1,0]],
  // shape Z
  [[1,1,0],[0,1,1]],
  // shape L
  [[1,0,0],[1,1,1]],
  // shape J
  [[0,0,1],[1,1,1]],
  // shape T
  [[1,1,1],[0,1,0]]
];

function startTetris() {
  if (tetrisIntervalId) clearInterval(tetrisIntervalId);
  tetrisCanvas = document.getElementById('tetris-canvas');
  tetrisCtx = tetrisCanvas.getContext('2d');

  // init board
  tetrisBoard = [];
  for (let r = 0; r < tetrisRows; r++) {
    tetrisBoard[r] = new Array(tetrisCols).fill(0);
  }
  tetrisScore = 0;
  tetrisLines = 0;
  tetrisGameOver = false;
  document.getElementById('tetris-score').textContent = tetrisScore;
  document.getElementById('tetris-lines').textContent = tetrisLines;

  spawnTetrisPiece();

  document.removeEventListener('keydown', tetrisKeyDown);
  document.addEventListener('keydown', tetrisKeyDown);
  tetrisIntervalId = setInterval(tetrisGameLoop, 500);
}

function tetrisKeyDown(e) {
  if (tetrisGameOver) return;
  if (!tetrisCurrentPiece) return;
  let { shape, row, col } = tetrisCurrentPiece;

  if (e.key === 'ArrowLeft') {
    if (!collides(shape, row, col - 1)) {
      tetrisCurrentPiece.col--;
    }
  } else if (e.key === 'ArrowRight') {
    if (!collides(shape, row, col + 1)) {
      tetrisCurrentPiece.col++;
    }
  } else if (e.key === 'ArrowDown') {
    if (!collides(shape, row + 1, col)) {
      tetrisCurrentPiece.row++;
    } else {
      placePiece();
    }
  } else if (e.key === 'ArrowUp') {
    // rotate
    let rotated = rotateShape(shape);
    if (!collides(rotated, row, col)) {
      tetrisCurrentPiece.shape = rotated;
    }
  }
}

function tetrisGameLoop() {
  if (tetrisGameOver) return;
  if (!tetrisCurrentPiece) return;
  let { shape, row, col } = tetrisCurrentPiece;
  // move down
  if (!collides(shape, row + 1, col)) {
    tetrisCurrentPiece.row++;
  } else {
    placePiece();
  }
  drawTetris();
}

function spawnTetrisPiece() {
  let randShape = TETRIS_SHAPES[Math.floor(Math.random()*TETRIS_SHAPES.length)];
  tetrisCurrentPiece = { shape: randShape, row: 0, col: Math.floor(tetrisCols/2)-1 };
}

function collides(shape, row, col) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        let newR = row + r;
        let newC = col + c;
        if (newR < 0 || newR >= tetrisRows || newC < 0 || newC >= tetrisCols) {
          return true;
        }
        if (tetrisBoard[newR][newC]) {
          return true;
        }
      }
    }
  }
  return false;
}

function placePiece() {
  let { shape, row, col } = tetrisCurrentPiece;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        tetrisBoard[row + r][col + c] = 1;
      }
    }
  }
  clearLines();
  if (checkGameOver()) {
    tetrisGameOver = true;
    alert("Game Over (Tetris). Score: " + tetrisScore);
    return;
  }
  spawnTetrisPiece();
}

function clearLines() {
  for (let r = 0; r < tetrisRows; r++) {
    if (tetrisBoard[r].every(cell => cell === 1)) {
      tetrisBoard.splice(r, 1);
      tetrisBoard.unshift(new Array(tetrisCols).fill(0));
      tetrisLines++;
      tetrisScore += 100;
    }
  }
  document.getElementById('tetris-score').textContent = tetrisScore;
  document.getElementById('tetris-lines').textContent = tetrisLines;
}

function checkGameOver() {
  // if top row is filled
  for (let c = 0; c < tetrisCols; c++) {
    if (tetrisBoard[0][c]) {
      return true;
    }
  }
  return false;
}

function rotateShape(shape) {
  let newShape = [];
  for (let c = 0; c < shape[0].length; c++) {
    let row = [];
    for (let r = shape.length-1; r >= 0; r--) {
      row.push(shape[r][c]);
    }
    newShape.push(row);
  }
  return newShape;
}

function drawTetris() {
  tetrisCtx.clearRect(0, 0, tetrisCanvas.width, tetrisCanvas.height);
  // draw board
  for (let r = 0; r < tetrisRows; r++) {
    for (let c = 0; c < tetrisCols; c++) {
      if (tetrisBoard[r][c]) {
        drawTetrisCell(c, r, '#ffbf80');
      }
    }
  }
  // draw current piece
  if (tetrisCurrentPiece) {
    let { shape, row, col } = tetrisCurrentPiece;
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          drawTetrisCell(col + c, row + r, '#80ffe5');
        }
      }
    }
  }
}

function drawTetrisCell(x, y, color) {
  tetrisCtx.fillStyle = color;
  tetrisCtx.fillRect(x*tetrisCellSize, y*tetrisCellSize, tetrisCellSize, tetrisCellSize);
  tetrisCtx.strokeStyle = '#333';
  tetrisCtx.strokeRect(x*tetrisCellSize, y*tetrisCellSize, tetrisCellSize, tetrisCellSize);
}

/******************************************************
 **************** 5) BRICK BREAKER ********************
*******************************************************/
let brickCanvas, brickCtx, brickIntervalId;
let brickX, brickY, brickDx, brickDy;
let brickPaddleX, brickPaddleWidth;
let brickRowCount = 5;
let brickColCount = 8;
let brickHeight = 20;
let brickWidth = 75;
let brickPadding = 10;
let brickOffsetTop = 30;
let brickOffsetLeft = 30;
let bricks = [];
let brickScore = 0;
let brickLives = 3;
let brickRightPressed = false;
let brickLeftPressed = false;

function startBrick() {
  if (brickIntervalId) clearInterval(brickIntervalId);
  brickCanvas = document.getElementById('brick-canvas');
  brickCtx = brickCanvas.getContext('2d');

  brickScore = 0;
  brickLives = 3;
  document.getElementById('brick-score').textContent = brickScore;
  document.getElementById('brick-lives').textContent = brickLives;

  // position ball
  brickX = brickCanvas.width / 2;
  brickY = brickCanvas.height - 30;
  brickDx = 3;
  brickDy = -3;

  // paddle
  brickPaddleWidth = 100;
  brickPaddleX = (brickCanvas.width - brickPaddleWidth)/2;

  // bricks
  bricks = [];
  for (let c = 0; c < brickColCount; c++) {
    bricks[c] = [];
    for (let r = 0; r < brickRowCount; r++) {
      bricks[c][r] = { x:0, y:0, status:1 };
    }
  }

  document.removeEventListener('keydown', brickKeyDown);
  document.removeEventListener('keyup', brickKeyUp);
  document.addEventListener('keydown', brickKeyDown);
  document.addEventListener('keyup', brickKeyUp);

  brickIntervalId = setInterval(brickGameLoop, 1000/60);
}

function brickKeyDown(e) {
  if (e.key === 'ArrowRight') brickRightPressed = true;
  else if (e.key === 'ArrowLeft') brickLeftPressed = true;
}

function brickKeyUp(e) {
  if (e.key === 'ArrowRight') brickRightPressed = false;
  else if (e.key === 'ArrowLeft') brickLeftPressed = false;
}

function brickGameLoop() {
  updateBrick();
  drawBrick();
}

function updateBrick() {
  // move ball
  brickX += brickDx;
  brickY += brickDy;
  // collisions
  if (brickX + brickDx < 0 || brickX + brickDx > brickCanvas.width) {
    brickDx = -brickDx;
  }
  if (brickY + brickDy < 0) {
    brickDy = -brickDy;
  } else if (brickY + brickDy > brickCanvas.height) {
    // check paddle
    if (brickX > brickPaddleX && brickX < brickPaddleX + brickPaddleWidth) {
      brickDy = -brickDy;
    } else {
      brickLives--;
      document.getElementById('brick-lives').textContent = brickLives;
      if (brickLives <= 0) {
        alert("Game Over (Brick Breaker). Score: " + brickScore);
        startBrick();
      } else {
        brickX = brickCanvas.width/2;
        brickY = brickCanvas.height - 30;
        brickDx = 3;
        brickDy = -3;
        brickPaddleX = (brickCanvas.width - brickPaddleWidth)/2;
      }
    }
  }
  // paddle movement
  if (brickRightPressed && brickPaddleX < brickCanvas.width - brickPaddleWidth) {
    brickPaddleX += 7;
  } else if (brickLeftPressed && brickPaddleX > 0) {
    brickPaddleX -= 7;
  }
  // collision with bricks
  for (let c = 0; c < brickColCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      let b = bricks[c][r];
      if (b.status === 1) {
        let bx = c*(brickWidth+brickPadding) + brickOffsetLeft;
        let by = r*(brickHeight+brickPadding) + brickOffsetTop;
        if (brickX > bx && brickX < bx+brickWidth && brickY > by && brickY < by+brickHeight) {
          brickDy = -brickDy;
          b.status = 0;
          brickScore++;
          document.getElementById('brick-score').textContent = brickScore;
          if (brickScore === brickRowCount*brickColCount) {
            alert("You Win! (Brick Breaker)");
            startBrick();
          }
        }
      }
    }
  }
}

function drawBrick() {
  brickCtx.clearRect(0, 0, brickCanvas.width, brickCanvas.height);
  // draw bricks
  for (let c = 0; c < brickColCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      let b = bricks[c][r];
      if (b.status === 1) {
        let bx = c*(brickWidth+brickPadding) + brickOffsetLeft;
        let by = r*(brickHeight+brickPadding) + brickOffsetTop;
        b.x = bx;
        b.y = by;
        brickCtx.fillStyle = '#80ffe5';
        brickCtx.fillRect(bx, by, brickWidth, brickHeight);
      }
    }
  }
  // draw ball
  brickCtx.beginPath();
  brickCtx.arc(brickX, brickY, 10, 0, Math.PI*2);
  brickCtx.fillStyle = '#ffbf80';
  brickCtx.fill();
  brickCtx.closePath();

  // draw paddle
  brickCtx.fillStyle = '#fff';
  brickCtx.fillRect(brickPaddleX, brickCanvas.height - 10, brickPaddleWidth, 10);
}

/******************************************************
 ***************** 6) TIC TAC TOE *********************
*******************************************************/
let ticBoard = Array(9).fill(null);
let ticCurrentPlayer = 'X';
let ticGameOver = false;
let ticCells, ticMessage;

function startTic() {
  ticBoard = Array(9).fill(null);
  ticCurrentPlayer = 'X';
  ticGameOver = false;
  ticCells = document.querySelectorAll('.tic-cell');
  ticMessage = document.getElementById('tic-message');

  ticCells.forEach(cell => {
    cell.textContent = '';
    cell.removeEventListener('click', ticClick);
    cell.addEventListener('click', ticClick);
  });
  ticMessage.textContent = "X's turn";
}

function ticClick(e) {
  if (ticGameOver) return;
  const index = e.target.getAttribute('data-index');
  if (ticBoard[index]) return;

  ticBoard[index] = ticCurrentPlayer;
  e.target.textContent = ticCurrentPlayer;

  if (ticCheckWin(ticCurrentPlayer)) {
    ticMessage.textContent = ticCurrentPlayer + " wins!";
    ticGameOver = true;
  } else if (ticBoard.every(cell => cell !== null)) {
    ticMessage.textContent = "It's a draw!";
    ticGameOver = true;
  } else {
    ticCurrentPlayer = (ticCurrentPlayer === 'X') ? 'O' : 'X';
    ticMessage.textContent = ticCurrentPlayer + "'s turn";
  }
}

function ticCheckWin(player) {
  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return wins.some(combo => combo.every(i => ticBoard[i] === player));
}

/******************************************************
 ***************** 7) MINESWEEPER *********************
*******************************************************/
const minesRows = 10;
const minesCols = 10;
const minesTotal = 10;
let minesBoard = [];
let minesRevealedCount = 0;
let minesFlagsUsed = 0;
let minesGameOver = false;

function startMines() {
  let boardEl = document.getElementById('minesweeper-board');
  boardEl.innerHTML = '';
  minesBoard = [];
  minesRevealedCount = 0;
  minesFlagsUsed = 0;
  minesGameOver = false;
  document.getElementById('mines-left').textContent = minesTotal;

  // build board
  for (let r = 0; r < minesRows; r++) {
    let row = [];
    for (let c = 0; c < minesCols; c++) {
      row.push({
        r, c, mine:false, revealed:false, flagged:false, adjacent:0
      });
    }
    minesBoard.push(row);
  }

  // place mines
  let placed = 0;
  while (placed < minesTotal) {
    let rr = Math.floor(Math.random()*minesRows);
    let cc = Math.floor(Math.random()*minesCols);
    if (!minesBoard[rr][cc].mine) {
      minesBoard[rr][cc].mine = true;
      placed++;
    }
  }

  // compute adjacency
  for (let r = 0; r < minesRows; r++) {
    for (let c = 0; c < minesCols; c++) {
      let cell = minesBoard[r][c];
      if (cell.mine) continue;
      cell.adjacent = countAdjacentMines(r,c);
    }
  }

  // create DOM
  for (let r = 0; r < minesRows; r++) {
    for (let c = 0; c < minesCols; c++) {
      let cellEl = document.createElement('div');
      cellEl.classList.add('mine-cell');
      cellEl.setAttribute('data-row', r);
      cellEl.setAttribute('data-col', c);
      cellEl.addEventListener('click', onMinesLeftClick);
      cellEl.addEventListener('contextmenu', onMinesRightClick);
      boardEl.appendChild(cellEl);
    }
  }
}

function countAdjacentMines(r, c) {
  let count = 0;
  for (let rr = r-1; rr <= r+1; rr++) {
    for (let cc = c-1; cc <= c+1; cc++) {
      if (rr >= 0 && rr < minesRows && cc >= 0 && cc < minesCols) {
        if (minesBoard[rr][cc].mine) count++;
      }
    }
  }
  return count;
}

function onMinesLeftClick(e) {
  e.preventDefault();
  if (minesGameOver) return;
  let row = parseInt(e.target.getAttribute('data-row'));
  let col = parseInt(e.target.getAttribute('data-col'));
  revealCell(row,col);
}

function onMinesRightClick(e) {
  e.preventDefault();
  if (minesGameOver) return;
  let row = parseInt(e.target.getAttribute('data-row'));
  let col = parseInt(e.target.getAttribute('data-col'));
  toggleFlag(row,col);
}

function revealCell(r,c) {
  let cell = minesBoard[r][c];
  if (cell.revealed || cell.flagged) return;
  cell.revealed = true;
  minesRevealedCount++;
  let cellEl = getCellEl(r,c);
  cellEl.classList.add('revealed');
  if (cell.mine) {
    cellEl.classList.add('mine');
    cellEl.textContent = 'X';
    gameOverMines(false);
    return;
  }
  if (cell.adjacent > 0) {
    cellEl.textContent = cell.adjacent;
  } else {
    // flood reveal
    for (let rr = r-1; rr <= r+1; rr++) {
      for (let cc = c-1; cc <= c+1; cc++) {
        if (rr >= 0 && rr < minesRows && cc >= 0 && cc < minesCols) {
          revealCell(rr,cc);
        }
      }
    }
  }
  checkMinesWin();
}

function toggleFlag(r,c) {
  let cell = minesBoard[r][c];
  if (cell.revealed) return;
  let cellEl = getCellEl(r,c);
  if (cell.flagged) {
    cell.flagged = false;
    cellEl.textContent = '';
    minesFlagsUsed--;
  } else {
    cell.flagged = true;
    cellEl.textContent = 'F';
    minesFlagsUsed++;
  }
  document.getElementById('mines-left').textContent = (minesTotal - minesFlagsUsed);
  checkMinesWin();
}

function checkMinesWin() {
  // if all non-mine cells are revealed
  if (minesRevealedCount === (minesRows*minesCols - minesTotal)) {
    gameOverMines(true);
  }
}

function gameOverMines(win) {
  minesGameOver = true;
  if (!win) {
    // reveal all mines
    for (let r=0; r<minesRows; r++) {
      for (let c=0; c<minesCols; c++) {
        let cell = minesBoard[r][c];
        if (cell.mine) {
          let el = getCellEl(r,c);
          el.classList.add('revealed','mine');
          el.textContent = 'X';
        }
      }
    }
    alert("You hit a mine! Game Over (Minesweeper).");
  } else {
    alert("You win! All mines avoided! (Minesweeper).");
  }
}

function getCellEl(r,c) {
  return document.querySelector(`.mine-cell[data-row='${r}'][data-col='${c}']`);
}
